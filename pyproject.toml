[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defender-vuln-agent"
version = "0.2.0"
description = "Read-only vulnerability assessment for Microsoft Defender estates: collect, enrich with CVE intelligence, prioritize by software product, report. Ships a Claude Code agent."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Frode Hus" }]
keywords = ["microsoft-defender", "vulnerability-management", "cve", "epss", "cisa-kev", "claude-code", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = ["msal>=1.28", "requests>=2.31", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dva = "dva.__main__:main"

[project.urls]
Homepage = "https://github.com/frodehus/defender-vuln-agent"
Repository = "https://github.com/frodehus/defender-vuln-agent"
Issues = "https://github.com/frodehus/defender-vuln-agent/issues"
Changelog = "https://github.com/frodehus/defender-vuln-agent/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["dva*"]

[tool.setuptools.package-data]
dva = ["queries/*.kql", "report_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
